[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supplycm"
version = "1.2.1"
description = "Supply Chain Management algorithms (397 pure-Python, no dependencies)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.6"
authors = [
    {name = "Atique", email = "11529740+atqatq@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/atqatq/supplycm"
Documentation = "https://github.com/atqatq/supplycm/tree/main/docs"
Issues = "https://github.com/atqatq/supplycm/issues"
