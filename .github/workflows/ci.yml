name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run tests
      run: python tests/run_tests.py

    - name: Run doctests
      run: |
        python -c "
        import doctest
        import supplycm
        from supplycm import inventory, forecasting, statistics, routing, network
        from supplycm import scheduling, mrp, optimization, supplier, warehouse, demand, risk
        modules = [inventory, forecasting, statistics, routing, network,
                   scheduling, mrp, optimization, supplier, warehouse, demand, risk]
        total_failures = 0
        for mod in modules:
            results = doctest.testmod(mod, verbose=False)
            total_failures += results.failed
        if total_failures > 0:
            print(f'{total_failures} doctest failures')
            exit(1)
        print('All doctests passed')
        "
